# USB dongle: central with two ESB peripherals (left=0, right=1).
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Battery reporting on RX (ESB central).
# These BLE-named central options are also used by the ESB-only transport.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_BT_MAX_PAIRED=2
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# USB-only central profile; display support is enabled by the eyelash/display shields.
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_POINTING=n

# Minimal horizontal status screen: USB HID + left/right battery only.
CONFIG_ZMK_DONGLE_DISPLAY_MODIFIERS=n
CONFIG_ZMK_DONGLE_DISPLAY_LAYER=n
CONFIG_ZMK_DONGLE_DISPLAY_BONGO_CAT=n
CONFIG_ZMK_DONGLE_DISPLAY_WPM=n
CONFIG_ZMK_HID_INDICATORS=n
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=n

# Diagnostic display layout: four compact rows.
