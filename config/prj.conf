# Kumbung ESB split transport (nRF52840 only).
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ZMK_BATTERY_REPORTING=n

# Kumbung README requirements.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=2
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48

# 2 kHz global TDMA slot rate + exactly two ESB pipes.
# Central rotates between the two pipes, giving each peripheral one
# radio slot every 1 ms (nominal 1 kHz per peripheral).
CONFIG_ESB_POLLING_RATE_2KHZ=y
CONFIG_ESB_PIPE_COUNT=2

# Keep the upstream default key-position event format for the first baseline.
CONFIG_ZMK_SPLIT_ESB_SEND_WHOLE_KEY=n
