# Kumbung ESB split transport (nRF52840 only).
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ZMK_BATTERY_REPORTING=n

# Kumbung README requirements.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=2
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48

# 2 kHz global TDMA slot rate. Each of the two peripherals receives
# every second 500 us slot, i.e. nominal 1 kHz per peripheral.
CONFIG_ESB_POLLING_RATE_2KHZ=y
CONFIG_ESB_PIPE_COUNT=8
CONFIG_ESB_TDMA_PIPE_COUNT=2

# Use a dedicated work queue for ESB RX processing.
CONFIG_ZMK_SPLIT_ESB_USE_WORK_QUEUE_DEDICATED=y

# Send the complete key state after a key-position change.
CONFIG_ZMK_SPLIT_ESB_SEND_WHOLE_KEY=y
